name: Rozkład i strona (gh-pages)

on:
  schedule:
    - cron: "30 1 * * *" # ≈ 02:30–03:30 w Warszawie; 2 zapytania do API PDP
    - cron: "30 5 * * *" # zapas — pomijany, gdy dane z dziś już są opublikowane
  push:
    branches: [main]
    paths: ["pipeline/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Testy pipeline'u
        working-directory: pipeline
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testy strony
        run: node --test web/test

      - name: Poprzednia publikacja
        run: |
          mkdir -p dist/data
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:data/trains.json > prev-trains.json || rm -f prev-trains.json
          fi

      - name: Budowa danych
        id: build
        continue-on-error: true
        env:
          # Klucz API PDP PLK tylko z sekretu repo — nigdy w plikach ani w logach.
          PDP_API_KEY: ${{ secrets.PDP_API_KEY }}
        run: |
          args="--out dist/data"
          if [ -f prev-trains.json ]; then
            args="$args --previous prev-trains.json"
            # Zapasowy cron nie zużywa zapytań, gdy pierwszy się udał.
            [ "${{ github.event.schedule }}" = "30 5 * * *" ] && args="$args --skip-if-fresh"
          fi
          python pipeline/build_trains.py $args

      - name: Decyzja o publikacji
        id: decide
        run: |
          if [ -f dist/data/trains.json ] && [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ] && [ -f prev-trains.json ]; then
            # Wdrożenie kodu strony ma działać, nawet gdy API nie odpowiada.
            echo "::warning::Budowa danych nie powiodła się — publikuję poprzedni trains.json"
            cp prev-trains.json dist/data/trains.json
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            [ "${{ steps.build.outcome }}" = "success" ] || echo "::error::Budowa danych nie powiodła się — brak publikacji, poprzednie dane zostają"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publikacja na gh-pages
        if: steps.decide.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          rsync -a --exclude test/ web/ dist/
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Strona i rozkład $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Błąd budowy przy cronie
        if: steps.build.outcome == 'failure' && github.event_name == 'schedule'
        run: exit 1
