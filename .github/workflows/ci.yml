name: CI

on:
  pull_request:
  push:
    branches-ignore: [gh-pages]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: pytest
        working-directory: pipeline
        run: |
          pip install -r requirements.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy strony
        run: node --test web/test/*.test.js
      - name: Testy Workera
        run: node --test worker/test/*.test.js
